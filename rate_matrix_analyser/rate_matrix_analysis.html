<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Matrix Flux & r_e Analysis</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            line-height: 1.5;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1, h2 { text-align: center; color: var(--primary); margin-top: 2rem;}
        h1 { margin-top: 0; }
        
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .cell {
            background: white;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cell.diagonal { background: #fff1f2; }
        .cell label { font-size: 0.7rem; color: #64748b; font-weight: bold; }
        
        input[type=number] {
            width: 85%;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: center;
        }
        th { background: #f8fafc; color: #475569; }
        tr:nth-child(even) { background-color: #fcfcfd; }

        .pi-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .val-card {
            background: #eff6ff;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
            text-align: center;
            min-width: 80px;
        }
        .nu-vector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        .nu-box {
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .highlight { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Rate Matrix (Q)</h1>

    <div id="matrix" class="matrix-grid"></div>

    <h2>Stationary Distribution (&pi;)</h2>
    <div class="pi-container" id="pi-display"></div>

    <h2>Edge Statistics</h2>
    <table id="flux-table">
        <thead>
            <tr>
                <th>e</th>
                <th>Pair (i,j)</th>
                <th>F<sub>e</sub> (&pi;<sub>i</sub>q<sub>ij</sub>)</th>
                <th>F<sub>rev</sub> (&pi;<sub>j</sub>q<sub>ji</sub>)</th>
                <th>S<sub>e</sub> (F<sub>e</sub>+F<sub>rev</sub>) <br>total flow</th>
                <th>J<sub>e</sub> (F<sub>e</sub>-F<sub>rev</sub>) <br>net flux</th>
                <th>&delta;<sub>e</sub> (J<sub>e</sub>/S<sub>e</sub>) <br>asymmetry</th>
                <th style="background: #fefce8;">r<sub>e</sub> (S<sub>e</sub>/&pi;<sub>i</sub>&pi;<sub>j</sub>) <br>rate</th>
            </tr>
        </thead>
        <tbody id="flux-body"></tbody>
    </table>

    <h2>Vector &nu; = U &sdot; J<sub>e</sub></h2>
    <div class="nu-vector" id="nu-display"></div>
</div>

<script>
    const size = 4;
    // Initial start values set to 1.0
    let Q = Array.from({ length: size }, () => Array(size).fill(1.0));
    
    const U = [
        [0, 1, -1, -1, 1, 0],
        [1, -1, 0, 0, 1, -1],
        [1, 0, -1, 1, 0, 1]
    ];

    const edges = [
        [0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]
    ];

    function updateDiagonals() {
        for(let i=0; i<size; i++) {
            let rowSum = 0;
            for(let j=0; j<size; j++) {
                if(i !== j) rowSum += Q[i][j];
            }
            Q[i][i] = -rowSum;
        }
    }

    function solvePi() {
        let A = [];
        for(let j=0; j<size; j++) {
            let row = [];
            for(let i=0; i<size; i++) row.push(Q[i][j]);
            A.push(row);
        }
        A[size-1] = new Array(size).fill(1);
        let b = [0, 0, 0, 1];
        return gaussianElimination(A, b);
    }

    function gaussianElimination(A, b) {
        let n = b.length;
        for (let i = 0; i < n; i++) {
            let max = i;
            for (let k = i + 1; k < n; k++) 
                if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
            [A[i], A[max]] = [A[max], A[i]];
            [b[i], b[max]] = [b[max], b[i]];
            for (let k = i + 1; k < n; k++) {
                let factor = A[k][i] / A[i][i];
                b[k] -= factor * b[i];
                for (let j = i; j < n; j++) A[k][j] -= factor * A[i][j];
            }
        }
        let x = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) {
            let sum = 0;
            for (let j = i + 1; j < n; j++) sum += A[i][j] * x[j];
            x[i] = (b[i] - sum) / A[i][i];
        }
        return x;
    }

    function calculateAll() {
        updateDiagonals();
        const pi = solvePi();
        
        let F_matrix = Array.from({ length: size }, () => Array(size).fill(0));
        for(let i=0; i<size; i++) {
            for(let j=0; j<size; j++) {
                if(i!==j) F_matrix[i][j] = pi[i] * Q[i][j];
            }
        }

        let Fe_vec = edges.map(pair => F_matrix[pair[0]][pair[1]]);
        let Frev_vec = edges.map(pair => F_matrix[pair[1]][pair[0]]);
        
        let Se = Fe_vec.map((f, i) => (f + Frev_vec[i])/2);
        let Je = Fe_vec.map((f, i) => (f - Frev_vec[i])/2);
        let De = Je.map((j, i) => Se[i] === 0 ? 0 : j / Se[i]);
        
        // Calculate r_e = S_e / (pi_i * pi_j)
        let re = edges.map((pair, i) => {
            const denom = pi[pair[0]] * pi[pair[1]];
            return denom === 0 ? 0 : Se[i] / denom;
        });

        let nu = [0, 0, 0];
        for(let r=0; r<3; r++) {
            for(let c=0; c<6; c++) {
                nu[r] += U[r][c] * Je[c];
            }
        }

        uiUpdateMatrix();
        uiUpdatePi(pi);
        uiUpdateFluxTable(Fe_vec, Frev_vec, Se, Je, De, re);
        uiUpdateNu(nu);
    }

    function uiUpdateMatrix() {
        const matrixEl = document.getElementById('matrix');
        if (matrixEl.children.length > 0) {
            for(let i=0; i<size; i++) {
                document.getElementById(`q-${i}-${i}`).innerText = Q[i][i].toFixed(3);
            }
            return;
        }
        
        for(let i=0; i<size; i++) {
            for(let j=0; j<size; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (i === j ? ' diagonal' : '');
                cell.innerHTML = `<label>q<sub>${i+1}${j+1}</sub></label>`;
                
                if (i === j) {
                    const span = document.createElement('span');
                    span.id = `q-${i}-${j}`;
                    span.className = 'highlight';
                    span.innerText = Q[i][j].toFixed(3);
                    cell.appendChild(span);
                } else {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '0.1';
                    input.min = '0.0';
                    input.value = Q[i][j];
                    input.oninput = (e) => {
                        Q[i][j] = parseFloat(e.target.value);// || 0.001;
                        calculateAll();
                    };
                    cell.appendChild(input);
                }
                matrixEl.appendChild(cell);
            }
        }
    }

    function uiUpdatePi(pi) {
        const container = document.getElementById('pi-display');
        container.innerHTML = pi.map((p, i) => `
            <div class="val-card">
                <div style="font-size:0.7rem; color:#64748b">&pi;<sub>${i+1}</sub></div>
                <div style="font-weight:bold; font-size:1.1rem">${p.toFixed(4)}</div>
            </div>
        `).join('');
    }

    function uiUpdateFluxTable(Fe, Frev, Se, Je, De, re) {
        const body = document.getElementById('flux-body');
        body.innerHTML = edges.map((pair, i) => `
            <tr>
                <td>${i+1}</td>
                <td>(${pair[0]+1},${pair[1]+1})</td>
                <td>${Fe[i].toFixed(4)}</td>
                <td>${Frev[i].toFixed(4)}</td>
                <td>${Se[i].toFixed(4)}</td>
                <td>${Je[i].toFixed(4)}</td>
                <td>${De[i].toFixed(4)}</td>
                <td style="background: #fffdeb; font-weight:bold;">${re[i].toFixed(4)}</td>
            </tr>
        `).join('');
    }

    function uiUpdateNu(nu) {
        const container = document.getElementById('nu-display');
        container.innerHTML = nu.map((n, i) => `
            <div class="nu-box">
                <span style="color:#7c3aed; font-size:0.8rem">ROW ${i+1}: &nu;<sub>${i+1}</sub> =</span> ${n.toFixed(5)}
            </div>
        `).join('');
    }

    calculateAll();
</script>

</body>
</html>
