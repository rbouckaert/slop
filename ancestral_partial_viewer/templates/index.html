<!DOCTYPE html>
<html>
<head>
    <title>Phylogenetic ASR - Proportional Branches</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        #controls { width: 320px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #tree-viz { flex-grow: 1; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; font-family: monospace; }
        .node circle { fill: #fff; stroke: #2c3e50; stroke-width: 2px; }
        .node text { font: 11px sans-serif; font-weight: bold; }
        .link { fill: none; stroke: #bdc3c7; stroke-width: 2px; }
        .partials-text { font-size: 10px; fill: #e67e22; font-weight: normal; }
        input { margin-left: 5px; text-align: center; }
        h3 { border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>

<h1>Ancestral State Reconstruction</h1>
<p>Proportional Branch Lengths (JC69 Model)</p>

<div class="container">
    <div id="controls">
        <h3>1. Newick Tree</h3>
        <textarea id="nwk-input">((A:0.1,B:0.5)Int1:0.2,(C:0.3,D:0.05)Int2:0.4)Root;</textarea>
        
        <h3>2. Tip States</h3>
        <div id="state-inputs"></div>
        <button onclick="runASR()" style="margin-top:15px; width:100%; padding: 10px; background: #3498db; color:white; border:none; border-radius:4px; cursor:pointer;">Run Reconstruction</button>
    </div>
    <div id="tree-viz"></div>
</div>

<script>
    function updateTipInputs() {
        const nwk = document.getElementById('nwk-input').value;
        // Regex looks for words immediately followed by a colon (tip names)
        const tips = nwk.match(/[a-zA-Z0-9_]+(?=:)/g) || [];
        const container = document.getElementById('state-inputs');
        container.innerHTML = '';
        tips.forEach(tip => {
            container.innerHTML += `<div style="margin-bottom:5px;">${tip}: <input class="tip-state" data-tip="${tip}" value="A" size="1" maxlength="1"></div>`;
        });
    }

    document.getElementById('nwk-input').addEventListener('input', updateTipInputs);
    updateTipInputs();

    async function runASR() {
        const nwk = document.getElementById('nwk-input').value;
        const states = {};
        document.querySelectorAll('.tip-state').forEach(el => {
            states[el.dataset.tip] = el.value.toUpperCase();
        });

        const formData = new FormData();
        formData.append('newick', nwk);
        formData.append('states', JSON.stringify(states));

        try {
            const response = await fetch('/process', { method: 'POST', body: formData });
            const data = await response.json();
            drawTree(data);
        } catch (err) {
            alert("Check Newick format or Tip Names.");
        }
    }

    function drawTree(data) {
        d3.select("#tree-viz").selectAll("*").remove();
        
        const width = 900, height = 600;
        const margin = {top: 40, right: 180, bottom: 40, left: 40};
        
        const svg = d3.select("#tree-viz").append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // 1. Hierarchy and basic cluster layout (for vertical spacing)
        const root = d3.hierarchy(data);
        const cluster = d3.cluster().size([height - margin.top - margin.bottom, width - margin.left - margin.right]);
        cluster(root);

        // 2. Scale the X positions (horizontal) based on phylogenetic distance
        const maxDist = d3.max(root.descendants(), d => d.data.dist);
        const xScale = (width - margin.left - margin.right) / (maxDist || 1);

        root.descendants().forEach(d => {
            d.y = d.data.dist * xScale; // Overriding the automatic horizontal position
        });

        // 3. Draw Links (Branches)
        svg.selectAll(".link")
            .data(root.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x));

        // 4. Draw Nodes
        const node = svg.selectAll(".node")
            .data(root.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.y},${d.x})`);

        node.append("circle").attr("r", 4.5);

        // Labels
        node.append("text")
            .attr("dy", -10)
            .attr("x", 8)
            .style("text-anchor", "start")
            .text(d => d.data.name);

        // Probabilities
        node.append("text")
            .attr("class", "partials-text")
            .attr("dy", 15)
            .attr("x", 8)
            .html(d => {
                if (!d.data.partials || d.data.partials.length === 0) return "";
                const p = d.data.partials;
                return `[A:${p[0].toFixed(2)} C:${p[1].toFixed(2)} G:${p[2].toFixed(2)} T:${p[3].toFixed(2)}]`;
            });
    }
</script>
</body>
</html>
